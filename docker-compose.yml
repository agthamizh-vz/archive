services:
  api:
    build: .
    container_name: viewzen-rag-api
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  streamlit:
    build: .
    container_name: viewzen-rag-ui
    command: python -m streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - api
